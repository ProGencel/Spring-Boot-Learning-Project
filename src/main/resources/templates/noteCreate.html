<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="layout :: layout(~{::title}, ~{::body})">
<head>
    <title>Create Note</title>
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 class="mb-4">Create New Note</h2>
            <form th:action="@{/mvc/note/save}" method="post">
                <div class="mb-3">
                    <label for="title" class="form-label">Title</label>
                    <input type="text" class="form-control" id="title" name="title" placeholder="Enter note title" required>
                </div>

                <div class="mb-3">
                    <label for="detail" class="form-label">Note Detail</label>
                    <textarea class="form-control" id="detail" name="detail" rows="5" placeholder="Enter note details" required></textarea>
                </div>

                <div class="mb-3 w-25">
                    <label for="noteDay" class="form-label">Day</label>
                    <input type="number" class="form-control" id="noteDay" name="noteDay" required>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success"><i class="bi bi-check-circle"></i> Create</button>
                    <a href="/mvc/note" class="btn btn-secondary"><i class="bi bi-x-circle"></i> Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
